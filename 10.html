<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIAMOND NEXUS | Mobile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00f3ff;
            --neon-pink: #bc13fe;
            --danger-red: #ff4757;
            --glass-bg: rgba(20, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --nav-height: 70px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            background-image: linear-gradient(to bottom, #050510, #1a0b2e);
            color: white;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px; /* Space for bottom nav */
        }

        /* --- CANVAS BG --- */
        #mesh-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- HEADER --- */
        .top-bar {
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .date-display {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .date-nav-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            width: 35px; height: 35px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- VIEWS (Tabs) --- */
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- DIAMOND CARDS --- */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .sub-jp { font-size: 0.7em; color: var(--neon-cyan); opacity: 0.8; margin-left: 5px; font-family: 'Exo 2', sans-serif;}

        /* --- INPUTS --- */
        textarea, input[type="text"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px; /* Prevents iOS zoom */
            resize: none;
            min-height: 100px;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            background: rgba(0,0,0,0.5);
        }

        /* --- GAMIFICATION ELEMENTS --- */
        .lvl-badge {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            color: black;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .xp-bar-wrapper {
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .xp-fill {
            height: 100%; width: 0%;
            background: var(--neon-cyan);
            transition: width 0.5s ease;
        }

        /* --- TASKS --- */
        .task-input-wrapper { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-action {
            background: var(--neon-cyan);
            border: none;
            color: black;
            font-weight: bold;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .task-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex; align-items: center;
            border-left: 3px solid transparent;
        }
        .task-item.done {
            opacity: 0.6;
            text-decoration: line-through;
            border-left-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
        }

        /* --- TIMER & STATS (View 2) --- */
        .timer-display {
            font-size: 3.5rem;
            text-align: center;
            font-weight: 700;
            margin: 20px 0;
            text-shadow: 0 0 20px var(--neon-pink);
        }
        .timer-controls { display: flex; gap: 10px; justify-content: center; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        /* NEW: CLEAR BUTTON STYLE */
        .btn-clear {
            background: transparent;
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            opacity: 0.7;
            transition: 0.3s;
        }
        .btn-clear:hover { opacity: 1; background: rgba(255, 71, 87, 0.1); }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .badge-box {
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            opacity: 0.3; filter: grayscale(1);
        }
        .badge-box.unlocked { opacity: 1; filter: grayscale(0); border: 1px solid var(--neon-cyan); }

        /* --- BOTTOM NAVIGATION (Mobile) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(10px);
            height: var(--nav-height);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--glass-border);
            z-index: 999;
        }

        .nav-item {
            color: #888;
            text-align: center;
            font-size: 0.8rem;
            padding: 10px;
            width: 50%;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .nav-item.active {
            color: var(--neon-cyan);
        }
        
        .nav-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

    </style>
</head>
<body>

<canvas id="mesh-canvas"></canvas>

<div class="top-bar">
    <button class="date-nav-btn" onclick="changeDate(-1)">❮</button>
    <div class="date-display" id="dateDisplay">Loading...</div>
    <button class="date-nav-btn" onclick="changeDate(1)">❯</button>
</div>

<div class="container">

    <div id="view-journal" class="view-section active">
        
        <div class="glass-panel" style="padding: 15px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <span style="font-size:0.8rem; color:#aaa;">CURRENT RANK</span>
                <div style="font-weight:bold; color:var(--neon-cyan);" id="rankHeader">Initiate</div>
            </div>
            <div class="lvl-badge">LVL <span id="lvlHeader">1</span></div>
        </div>

        <div class="glass-panel">
            <div class="card-header">
                1. IKIGAI <span class="sub-jp">生き甲斐</span>
            </div>
            <textarea id="ikigai" onblur="saveData('ikigai')" placeholder="My purpose today is..."></textarea>
        </div>

        <div class="glass-panel">
            <div class="card-header">
                2. GANBARU <span class="sub-jp">頑張る</span>
            </div>
            <div class="task-input-wrapper">
                <input type="text" id="taskInput" placeholder="Add Task...">
                <button class="btn-action" onclick="addTask()">+</button>
            </div>
            <div id="taskList"></div>
        </div>

        <div class="glass-panel">
            <div class="card-header">
                3. KAIZEN <span class="sub-jp">改善</span>
            </div>
            <textarea id="kaizen" onblur="saveData('kaizen')" placeholder="I improved..."></textarea>
        </div>

        <div class="glass-panel">
            <div class="card-header">
                4. WABI SABI <span class="sub-jp">侘寂</span>
            </div>
            <textarea id="wabi" onblur="saveData('wabi')" placeholder="Closing thoughts..."></textarea>
        </div>

        <button class="btn-clear" onclick="clearDay()">⚠ Reset Cycle (Clear Entry)</button>
    </div>

    <div id="view-nexus" class="view-section">
        
        <div class="glass-panel" style="text-align:center;">
            <div style="font-size:4rem; margin-bottom:10px;">💎</div>
            <h2 style="margin:0; font-family:'Cinzel',serif;">PLAYER STATS</h2>
            <p style="color:#aaa;">Level <span id="nexusLvl">1</span> &bull; <span id="nexusRank">Initiate</span></p>
            
            <div class="xp-bar-wrapper">
                <div class="xp-fill" id="xpFill"></div>
            </div>
            <div style="font-size:0.8rem; margin-top:5px; text-align:right;" id="xpText">0 / 100 XP</div>
        </div>

        <div class="glass-panel">
            <div class="card-header">ZEN FOCUS TIMER</div>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button class="btn-outline" onclick="startTimer()">Start</button>
                <button class="btn-outline" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <div class="glass-panel">
            <div class="card-header">INVENTORY</div>
            <div class="inventory-grid" id="badgeGrid"></div>
        </div>

        <button class="btn-outline" style="width:100%; margin-top:20px;" onclick="exportData()">Download Backup</button>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchView('journal')">
        <span class="nav-icon">📖</span>
        JOURNAL
    </div>
    <div class="nav-item" onclick="switchView('nexus')">
        <span class="nav-icon">💎</span>
        NEXUS
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
    // --- APP STATE ---
    let currentDate = new Date();
    let gameState = {
        xp: 0,
        level: 1,
        badges: []
    };
    
    const BADGES = [
        { id: 0, icon: '🌱', desc: 'Novice' },
        { id: 1, icon: '⚔️', desc: 'Warrior' },
        { id: 2, icon: '💎', desc: 'Diamond' },
        { id: 3, icon: '👑', desc: 'Legend' }
    ];

    // --- INIT ---
    window.onload = function() {
        initParticles();
        loadGlobalState();
        renderDate();
        loadDailyData();
        renderBadges();
        updateHUD();
    };

    // --- NAVIGATION ---
    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${viewName}`).classList.add('active');
        const idx = viewName === 'journal' ? 0 : 1;
        document.querySelectorAll('.nav-item')[idx].classList.add('active');
    }

    function changeDate(offset) {
        currentDate.setDate(currentDate.getDate() + offset);
        renderDate();
        loadDailyData();
    }

    function renderDate() {
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('dateDisplay').innerText = currentDate.toLocaleDateString('en-US', options);
    }

    // --- DATA HANDLING ---
    function getKey() { return `mobile_nexus_${currentDate.toISOString().split('T')[0]}`; }

    function loadDailyData() {
        const data = JSON.parse(localStorage.getItem(getKey())) || { 
            ikigai: '', kaizen: '', wabi: '', tasks: [] 
        };
        
        document.getElementById('ikigai').value = data.ikigai;
        document.getElementById('kaizen').value = data.kaizen;
        document.getElementById('wabi').value = data.wabi;
        renderTasks(data.tasks);
    }

    function saveData(field) {
        const data = JSON.parse(localStorage.getItem(getKey())) || { tasks: [] };
        const val = document.getElementById(field).value;
        
        if(val.length > 5 && (!data[field] || data[field].length < 5)) {
            addXP(20);
            confetti({ particleCount: 30, spread: 60, origin: { y: 0.5 } });
        }
        
        data[field] = val;
        localStorage.setItem(getKey(), JSON.stringify(data));
    }

    // --- CLEAR FUNCTION ---
    function clearDay() {
        if(confirm("Are you sure you want to erase today's entry? This cannot be undone.")) {
            // Reset Text Inputs
            document.getElementById('ikigai').value = '';
            document.getElementById('kaizen').value = '';
            document.getElementById('wabi').value = '';
            
            // Clear LocalStorage for this date
            const emptyData = { ikigai: '', kaizen: '', wabi: '', tasks: [] };
            localStorage.setItem(getKey(), JSON.stringify(emptyData));
            
            // Re-render tasks (empty)
            renderTasks([]);
            
            alert("Entry cleared.");
        }
    }

    // --- TASKS ---
    function addTask() {
        const input = document.getElementById('taskInput');
        if(!input.value) return;
        
        const data = JSON.parse(localStorage.getItem(getKey())) || { tasks: [] };
        data.tasks.push({ text: input.value, done: false });
        localStorage.setItem(getKey(), JSON.stringify(data));
        
        input.value = '';
        renderTasks(data.tasks);
    }

    function toggleTask(i) {
        const data = JSON.parse(localStorage.getItem(getKey()));
        data.tasks[i].done = !data.tasks[i].done;
        
        if(data.tasks[i].done) {
            addXP(15);
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.6 }, colors:['#00f3ff'] });
        }
        
        localStorage.setItem(getKey(), JSON.stringify(data));
        renderTasks(data.tasks);
    }

    function renderTasks(tasks) {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        if(!tasks) return;

        tasks.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = `task-item ${t.done ? 'done' : ''}`;
            div.innerHTML = `<span style="margin-right:10px;">${t.done ? '▣' : '▢'}</span> ${t.text}`;
            div.onclick = () => toggleTask(i);
            list.appendChild(div);
        });
    }

    // --- GAMIFICATION ---
    function loadGlobalState() {
        const saved = localStorage.getItem('mobile_nexus_global');
        if(saved) gameState = JSON.parse(saved);
    }

    function addXP(amount) {
        gameState.xp += amount;
        const threshold = gameState.level * 100;
        
        if(gameState.xp >= threshold) {
            gameState.xp -= threshold;
            gameState.level++;
            alert(`LEVEL UP! You are now Level ${gameState.level}`);
            
            // Badge Logic
            if(gameState.level >= 2 && !gameState.badges.includes(0)) gameState.badges.push(0);
            if(gameState.level >= 5 && !gameState.badges.includes(1)) gameState.badges.push(1);
            if(gameState.level >= 10 && !gameState.badges.includes(2)) gameState.badges.push(2);
            renderBadges();
        }
        
        localStorage.setItem('mobile_nexus_global', JSON.stringify(gameState));
        updateHUD();
    }

    function updateHUD() {
        document.getElementById('lvlHeader').innerText = gameState.level;
        document.getElementById('nexusLvl').innerText = gameState.level;
        
        const ranks = ["Initiate", "Seeker", "Adept", "Guardian", "Legend"];
        const rName = ranks[Math.min(Math.floor(gameState.level/5), 4)];
        document.getElementById('rankHeader').innerText = rName;
        document.getElementById('nexusRank').innerText = rName;
        
        const threshold = gameState.level * 100;
        const pct = (gameState.xp / threshold) * 100;
        document.getElementById('xpFill').style.width = `${pct}%`;
        document.getElementById('xpText').innerText = `${gameState.xp} / ${threshold} XP`;
    }

    function renderBadges() {
        const grid = document.getElementById('badgeGrid');
        grid.innerHTML = '';
        BADGES.forEach(b => {
            const unlocked = gameState.badges.includes(b.id);
            const el = document.createElement('div');
            el.className = `badge-box ${unlocked ? 'unlocked' : ''}`;
            el.innerText = b.icon;
            grid.appendChild(el);
        });
    }

    // --- TIMER ---
    let timerInterval;
    let time = 25 * 60;
    
    function startTimer() {
        if(timerInterval) return;
        timerInterval = setInterval(() => {
            time--;
            const m = Math.floor(time/60).toString().padStart(2,'0');
            const s = (time%60).toString().padStart(2,'0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
            
            if(time <= 0) {
                clearInterval(timerInterval);
                addXP(50);
                alert("Focus Complete!");
                resetTimer();
            }
        }, 1000);
    }
    
    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        time = 25 * 60;
        document.getElementById('timerDisplay').innerText = "25:00";
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "nexus_backup.json";
        a.click();
    }

    // --- PARTICLES ---
    function initParticles() {
        const c = document.getElementById('mesh-canvas');
        const ctx = c.getContext('2d');
        let w, h;
        
        function resize() {
            w = window.innerWidth; h = window.innerHeight;
            c.width = w; c.height = h;
        }
        window.onresize = resize;
        resize();
        
        const stars = Array(40).fill().map(() => ({
            x: Math.random()*w, y: Math.random()*h, s: Math.random()*2
        }));
        
        function anim() {
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = "rgba(255,255,255,0.3)";
            stars.forEach(st => {
                st.y -= 0.2;
                if(st.y < 0) st.y = h;
                ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();
    }
</script>

</body>
</html>
